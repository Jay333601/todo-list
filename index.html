<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Modern To-Do List</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Header & Theme Toggle -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1>TaskFlow</h1>
          <p class="subtitle">Stay organized, focused, and productive</p>
        </div>
      </div>

      <button id="theme-toggle" class="icon-btn theme-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
        <!-- Sun Icon (shown in dark mode) -->
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <main class="app-main">
      <!-- Create Task Form Card -->
      <section class="card form-card">
        <h2 class="section-title">Create New Task</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="task-title">Task Title <span class="required">*</span></label>
            <input type="text" id="task-title" placeholder="What needs to be done?" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="task-notes">Description / Notes <span class="optional">(Optional)</span></label>
            <textarea id="task-notes" rows="2" placeholder="Add helpful details, links, or sub-steps..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Priority Level</label>
              <select id="task-priority">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
              </select>
            </div>

            <div class="form-group">
              <label for="task-due-date">Due Date <span class="optional">(Optional)</span></label>
              <input type="date" id="task-due-date">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-add">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Task
          </button>
        </form>
      </section>

      <!-- Search, Filters & Stats Controls -->
      <section class="controls-section">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search tasks by title..." autocomplete="off">
        </div>

        <div class="filter-toolbar">
          <div class="filter-tabs" role="tablist">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
          </div>

          <div class="task-stats">
            <span id="active-count">0 tasks remaining</span>
            <button type="button" id="clear-completed-btn" class="btn-text-danger">Clear Completed</button>
          </div>
        </div>
      </section>

      <!-- Task List & Empty State -->
      <section class="tasks-section">
        <div id="task-list" class="task-list"></div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <path d="M9 16l2 2 4-4"></path>
            </svg>
          </div>
          <h3 id="empty-title">No tasks yet</h3>
          <p id="empty-subtitle">Add a task above to start organizing your day.</p>
        </div>
      </section>
    </main>

  </div>

  <!-- Main JavaScript -->
  <script src="script.js"></script>
</body>
</html>
